[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-course-toolkit"
version = "0.1.0"
description = "SIPL parser, interpreter and compositional semantics for the Programming Theory course"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lark==1.3.1"]

[project.scripts]
sipl = "sipl.cli:main"

[tool.setuptools.package-data]
sipl = ["grammar/*.lark", "result-v1.schema.json"]
